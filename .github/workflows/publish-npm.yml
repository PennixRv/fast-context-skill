name: Publish npm (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "26.5.1"
      - run: npm install --global npm@12.0.1
      - run: npm ci --ignore-scripts
      - run: |
          node --input-type=module -e 'import("./scripts/release/verify-tag.mjs").then(({ verifyTag }) => verifyTag({ tag: process.env.RELEASE_TAG }))'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - name: Report deterministic release digest
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { buildTarball } from "./scripts/release/verify-release-evidence.mjs";
          const tag = process.env.RELEASE_TAG;
          const expected = JSON.parse(execFileSync("git", ["show", `${tag}:docs/releases/attestations/${tag}.json`], { encoding: "utf8" })).artifacts.tarball_sha256;
          const source = execFileSync("git", ["rev-parse", `${tag}^{}^`], { encoding: "utf8" }).trim();
          const actual = buildTarball(source).sha256;
          console.log(JSON.stringify({ expected, actual, match: expected === actual }));
          NODE
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - name: Build diagnostic tarball before release evidence verification
        run: node scripts/release/build-package.mjs --output dist/rebuilt-diagnostic > rebuilt-package.json
      - name: Retain diagnostic tarball when the immutable digest gate fails
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-npm-tarball-${{ github.run_id }}
          path: dist/rebuilt-diagnostic/*.tgz
          if-no-files-found: error
      - name: Load the attested release tarball
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          TARBALL="$(node -p "JSON.parse(require('fs').readFileSync('docs/releases/attestations/' + process.env.RELEASE_TAG + '.json', 'utf8')).artifacts.tarball_filename")"
          mkdir -p dist/attested-package
          git fetch --no-tags origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:docs/releases/artifacts/$RELEASE_TAG.tgz" > "dist/attested-package/$TARBALL"
          EXPECTED="$(node -p "JSON.parse(require('fs').readFileSync('docs/releases/attestations/' + process.env.RELEASE_TAG + '.json', 'utf8')).artifacts.tarball_sha256")"
          ACTUAL="$(sha256sum "dist/attested-package/$TARBALL" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          printf '{"filename":"%s"}\n' "$TARBALL" > pack.json
      - run: |
          node --input-type=module -e 'import("./scripts/release/verify-release-evidence.mjs").then(({ verifyReleaseEvidence }) => verifyReleaseEvidence({ tag: process.env.RELEASE_TAG, buildArtifact: false }))'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - name: Expose setup-node runtime to empty test environments
        run: |
          NODE_EXECUTABLE="$(command -v node)"
          test -x "$NODE_EXECUTABLE"
          sudo ln -sf "$NODE_EXECUTABLE" /usr/bin/node
          /usr/bin/node --version
      - run: npm test
      - run: npm run verify:provenance
      - run: npm run pack:check
      - name: Record exact tarball digest
        id: pack
        shell: bash
        run: |
          TARBALL="$(node -p "JSON.parse(require('fs').readFileSync('pack.json','utf8')).filename")"
          SHA256="$(sha256sum "dist/attested-package/$TARBALL" | awk '{print $1}')"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "tarball_sha256=$SHA256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-npm-tarball
          path: dist/attested-package/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      tarball_sha256: ${{ steps.pack.outputs.tarball_sha256 }}

  publish:
    needs: validate
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ""
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "26.5.1"
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@12.0.1
      - run: npm ci --ignore-scripts
      - run: |
          node --input-type=module -e 'import("./scripts/release/verify-tag.mjs").then(({ verifyTag }) => verifyTag({ tag: process.env.RELEASE_TAG }))'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - run: |
          node --input-type=module -e 'import("./scripts/release/verify-release-evidence.mjs").then(({ verifyReleaseEvidence }) => verifyReleaseEvidence({ tag: process.env.RELEASE_TAG, buildArtifact: false }))'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - name: Verify source checkout is clean before artifact download
        run: test -z "$(git status --porcelain)"
      - uses: actions/download-artifact@v4
        with:
          name: verified-npm-tarball
          path: verified-tarball
      - name: Recheck exact tarball, offline install, and cleanliness
        env:
          EXPECTED_TARBALL: ${{ needs.validate.outputs.tarball }}
          EXPECTED_TARBALL_SHA256: ${{ needs.validate.outputs.tarball_sha256 }}
        run: |
          TARBALL="verified-tarball/$EXPECTED_TARBALL"
          TARBALL_PATH="$GITHUB_WORKSPACE/$TARBALL"
          test -f "$TARBALL_PATH"
          test "$(sha256sum "$TARBALL_PATH" | awk '{print $1}')" = "$EXPECTED_TARBALL_SHA256"
          SMOKE_DIR="$(mktemp -d)"
          npm install --offline --ignore-scripts --no-audit --no-fund --prefix "$SMOKE_DIR" "$TARBALL_PATH"
          node "$SMOKE_DIR/node_modules/@pennixrv/fast-context-skill/scripts/fast-context-search.mjs" --help
      - name: Require an explicit registry 404
        shell: bash
        run: |
          PACKAGE="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          set +e
          npm view "$PACKAGE@$VERSION" version --json > registry.json 2> registry.err
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "version already exists"
            exit 1
          fi
          if ! grep -Eq 'E404|404 Not Found' registry.err; then
            echo "registry lookup did not return an explicit 404"
            exit 1
          fi
      - name: Publish exact tarball with npm Trusted Publisher
        env:
          PACKAGE_NAME: ${{ needs.validate.outputs.tarball }}
        run: |
          TARBALL_PATH="$GITHUB_WORKSPACE/verified-tarball/$PACKAGE_NAME"
          unset NODE_AUTH_TOKEN
          npm publish "$TARBALL_PATH" --access public --ignore-scripts
      - name: Poll registry for exact published version
        shell: bash
        run: |
          PACKAGE="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3 4 5 6; do
            if [ "$(npm view "$PACKAGE@$VERSION" version --json --prefer-online 2>/dev/null | tr -d '\"')" = "$VERSION" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "published version did not become visible"
          exit 1
      - name: Verify npm registry signatures and attestations
        shell: bash
        run: |
          PACKAGE="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          VERIFY_DIR="$(mktemp -d)"
          npm init --yes --prefix "$VERIFY_DIR" >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --prefix "$VERIFY_DIR" "$PACKAGE@$VERSION"
          npm audit signatures --prefix "$VERIFY_DIR"
